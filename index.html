<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHONEVERSE - Comparador de Celulares</title>
  <style>
   /*
  
       1. VARIABLES DE TEMA Y ESTILOS BASE */
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #38bdf8; /* Cian */
      --gold: #f59e0b;
      --border-color: #334155;
    }

    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-card: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --accent: #0284c7;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      transition: background-color 0.3s ease, color 0.3s ease;
      padding: 2rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    button {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      border-color: var(--accent);
    }

    button:active {
      transform: scale(0.97);
    }

    /* ==========================================
       2. EMOJI 📱: ANIMACIÓN RESPIRACIÓN + GLOW CIAN
       ========================================== */
    .emoji-phone-wrapper {
      position: relative;
      display: inline-block;
      font-size: 2.2rem;
      vertical-align: middle;
    }

    .emoji-phone-wrapper::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 85%;
      height: 85%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.65) 0%, rgba(56, 189, 248, 0) 75%);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      z-index: 0;
      pointer-events: none;
      animation: phoneGlow 2.6s ease-in-out infinite;
    }

    .emoji-phone {
      position: relative;
      z-index: 1;
      display: inline-block;
      animation: phonePulse 2.6s ease-in-out infinite;
    }

    @keyframes phonePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    @keyframes phoneGlow {
      0%, 100% {
        opacity: 0.2;
        transform: translate(-50%, -50%) scale(0.8);
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.35);
      }
    }

    /* ==========================================
       3. SECCIONES Y CONTENEDORES
       ========================================== */
    section {
      margin-bottom: 3rem;
    }

    h2 {
      margin-bottom: 1.2rem;
      font-size: 1.5rem;
    }

    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    /* ==========================================
       4. ANIMACIONES DE TARJETAS Y COMPARADOR
       ========================================== */
    .card-phone {
      background: var(--bg-card);
      padding: 1.5rem;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      animation: fadeInUp 0.4s ease-out forwards;
      opacity: 0;
      position: relative;
    }

    .badge {
      display: inline-block;
      background: var(--accent);
      color: #0f172a;
      font-weight: bold;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Transición en el Comparador */
    #comparador-wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      background: var(--bg-card);
      padding: 1.5rem;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .animar-cambio {
      animation: flashPulse 0.35s ease-in-out;
    }

    .stat-bar-container {
      background: var(--border-color);
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 6px;
    }

    .bar-stat {
      background: var(--accent);
      height: 100%;
      border-radius: 5px;
      transition: width 0.4s ease;
    }

    .animar-cambio .bar-stat {
      animation: growBar 0.5s ease-out;
    }

    @keyframes flashPulse {
      0% { opacity: 0.4; transform: scale(0.99); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes growBar {
      from { width: 0%; }
    }

    /* Selects del Comparador */
    .select-box {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      background: var(--bg-primary);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      margin-bottom: 1rem;
    }

    /* ==========================================
       5. BOTÓN FAVORITOS (ESTRELLA ANIMADA)
       ========================================== */
    .btn-fav {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-secondary);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      padding: 0;
    }

    .btn-fav:hover {
      border: none;
    }

    .btn-fav.active {
      color: var(--gold);
      transform: scale(1.2) rotate(8deg);
      animation: favPop 0.3s ease;
    }

    @keyframes favPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.4) rotate(-15deg); }
      100% { transform: scale(1.2) rotate(8deg); }
    }
  </style>
</head>
<body>

  <header>
    <h1>
      <span class="emoji-phone-wrapper"><span class="emoji-phone">📱</span></span>
      PHONEVERSE
    </h1>
    <div class="header-actions">
      <button id="btn-share">Copiar enlace 🔗</button>
      <button id="theme-toggle">🌓 Tema</button>
    </div>
  </header>

  <main>
    <!-- COMPARADOR -->
    <section id="comparador-section">
      <h2>Comparador Directo</h2>
      
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1rem;">
        <select id="select-celular-1" class="select-box" onchange="cambiarComparacion()"></select>
        <select id="select-celular-2" class="select-box" onchange="cambiarComparacion()"></select>
      </div>

      <div id="comparador-wrapper">
        <!-- Render dinámico desde JS -->
      </div>
    </section>

    <!-- FINDER / TOP 3 RECOMENDADOS -->
    <section id="finder-section">
      <h2>Top 3 Recomendados</h2>
      <div id="finder-results" class="grid-cards">
        <!-- Render dinámico desde JS -->
      </div>
    </section>
  </main>

  <script>
    // ==========================================
    // DATA BASE DE DATOS LOCAL
    // ==========================================
    const celulares = [
      { id: '1', nombre: 'PhoneVerse Pro Max', puntaje: 96, pantalla: 95, camara: 98, bateria: 92 },
      { id: '2', nombre: 'Galaxy Ultra X', puntaje: 91, pantalla: 94, camara: 90, bateria: 95 },
      { id: '3', nombre: 'Pixel Super 8', puntaje: 87, pantalla: 88, camara: 93, bateria: 85 },
      { id: '4', nombre: 'Lite Speed 5G', puntaje: 79, pantalla: 80, camara: 75, bateria: 88 }
    ];

    // ==========================================
    // INICIALIZACIÓN GENERAL
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
      inicializarTema();
      inicializarCopiarLink();
      poblarSelects();
      cambiarComparacion();
      mostrarTop3(celulares);
      actualizarIconosFavoritos();
    });

    // ==========================================
    // 1. MÓDULO: COPIAR LINK
    // ==========================================
    function inicializarCopiarLink() {
      const btnShare = document.getElementById('btn-share');
      btnShare?.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(window.location.href);
          const originalText = btnShare.textContent;
          btnShare.textContent = "¡Copiado! ✅";
          btnShare.style.pointerEvents = "none";

          setTimeout(() => {
            btnShare.textContent = originalText;
            btnShare.style.pointerEvents = "auto";
          }, 2000);
        } catch (err) {
          console.error("Error al copiar enlace: ", err);
        }
      });
    }

    // ==========================================
    // 2. MÓDULO: COMPARADOR CON ANIMACIÓN
    // ==========================================
    function poblarSelects() {
      const s1 = document.getElementById('select-celular-1');
      const s2 = document.getElementById('select-celular-2');
      if (!s1 || !s2) return;

      const opciones = celulares.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
      s1.innerHTML = opciones;
      s2.innerHTML = opciones;

      s1.selectedIndex = 0;
      s2.selectedIndex = 1;
    }

    function cambiarComparacion() {
      const id1 = document.getElementById('select-celular-1').value;
      const id2 = document.getElementById('select-celular-2').value;

      const cel1 = celulares.find(c => c.id === id1);
      const cel2 = celulares.find(c => c.id === id2);

      const contenedor = document.getElementById('comparador-wrapper');
      if (!contenedor || !cel1 || !cel2) return;

      // Reinicio de animación vía Reflow
      contenedor.classList.remove('animar-cambio');
      void contenedor.offsetWidth;

      contenedor.innerHTML = `
        ${generarColumnaComparador(cel1)}
        ${generarColumnaComparador(cel2)}
      `;

      contenedor.classList.add('animar-cambio');
      actualizarIconosFavoritos();
    }

    function generarColumnaComparador(cel) {
      return `
        <div style="position: relative;">
          <button class="btn-fav" data-fav-id="${cel.id}" onclick="toggleFavorito('${cel.id}')">☆</button>
          <h3>
            <span class="emoji-phone-wrapper"><span class="emoji-phone">📱</span></span>
            ${cel.nombre}
          </h3>
          <p style="margin: 10px 0; color: var(--text-secondary);">Puntaje general: <strong>${cel.puntaje}/100</strong></p>
          
          <label>Cámara (${cel.camara}%)</label>
          <div class="stat-bar-container"><div class="bar-stat" style="width: ${cel.camara}%;"></div></div>
          
          <label style="margin-top:10px; display:block;">Pantalla (${cel.pantalla}%)</label>
          <div class="stat-bar-container"><div class="bar-stat" style="width: ${cel.pantalla}%;"></div></div>
          
          <label style="margin-top:10px; display:block;">Batería (${cel.bateria}%)</label>
          <div class="stat-bar-container"><div class="bar-stat" style="width: ${cel.bateria}%;"></div></div>
        </div>
      `;
    }

    // ==========================================
    // 3. MÓDULO: TOP 3 RECOMENDADOS (FINDER)
    // ==========================================
    function mostrarTop3(lista) {
      const contenedor = document.getElementById('finder-results');
      if (!contenedor) return;

      const top3 = [...lista].sort((a, b) => b.puntaje - a.puntaje).slice(0, 3);

      contenedor.innerHTML = top3.map((cel, idx) => `
        <div class="card-phone" style="animation-delay: ${idx * 0.12}s;">
          <button class="btn-fav" data-fav-id="${cel.id}" onclick="toggleFavorito('${cel.id}')">☆</button>
          <span class="badge">#${idx + 1} Recomendado</span>
          <h3>
            <span class="emoji-phone-wrapper"><span class="emoji-phone">📱</span></span>
            ${cel.nombre}
          </h3>
          <p style="margin-top: 8px;">Puntaje: <strong>${cel.puntaje}/100</strong></p>
        </div>
      `).join('');

      actualizarIconosFavoritos();
    }

    // ==========================================
    // 4. MÓDULO: FAVORITOS LOCALSTORAGE
    // ==========================================
    function obtenerFavoritos() {
      return JSON.parse(localStorage.getItem('phoneverse_favs')) || [];
    }

    function toggleFavorito(id) {
      let favs = obtenerFavoritos();
      favs = favs.includes(id) ? favs.filter(item => item !== id) : [...favs, id];
      localStorage.setItem('phoneverse_favs', JSON.stringify(favs));
      actualizarIconosFavoritos();
    }

    function actualizarIconosFavoritos() {
      const favs = obtenerFavoritos();
      document.querySelectorAll('[data-fav-id]').forEach(btn => {
        const id = btn.getAttribute('data-fav-id');
        const esFav = favs.includes(id);
        btn.classList.toggle('active', esFav);
        btn.textContent = esFav ? '★' : '☆';
      });
    }

    // ==========================================
    // 5. MÓDULO: DARK / LIGHT MODE
    // ==========================================
    function inicializarTema() {
      const themeToggleBtn = document.getElementById('theme-toggle');
      const temaGuardado = localStorage.getItem('phoneverse_theme') || 
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

      document.documentElement.setAttribute('data-theme', temaGuardado);

      themeToggleBtn?.addEventListener('click', () => {
        const actual = document.documentElement.getAttribute('data-theme');
        const nuevo = actual === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', nuevo);
        localStorage.setItem('phoneverse_theme', nuevo);
      });
    }
  </script>
</body>
</html>
